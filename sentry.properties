# Sentry configuration for source maps upload
# This file is used by the Sentry webpack plugin to upload source maps

defaults.url=https://sentry.io/
defaults.org=YOUR_ORG_SLUG
defaults.project=decisionos

# Auth token for uploading source maps
# Set this via environment variable: SENTRY_AUTH_TOKEN
# Get from: https://sentry.io/settings/account/api/auth-tokens/
# Required scopes: project:read, project:releases, org:read
